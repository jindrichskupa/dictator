name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install tmux fzf jq
      - name: Run the suite
        run: zsh test/dict_test.sh

  release:
    # Never publish a tag whose tests do not pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  tap:
    # Adds Formula/dictator.rb to jindrichskupa/homebrew-tap so
    # `brew upgrade dictator` sees the new version.
    #
    # The tap already holds Casks/franta.rb, generated by GoReleaser. Casks and
    # formulae live in separate directories, so nothing here touches it: a cask
    # ships a prebuilt binary, a formula builds from source, and dictator is
    # source. Only Formula/dictator.rb is ever written.
    #
    # Skipped silently when HOMEBREW_TAP_TOKEN is absent, so a missing secret
    # never fails the release itself.
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_REPO: homebrew-tap
      TAP_BRANCH: master
    steps:
      - uses: actions/checkout@v5

      - name: Check for the tap token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the release tarball checksum
        if: steps.gate.outputs.enabled == 'true'
        id: sha
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -sSfL "$url" -o release.tar.gz
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update the formula in the tap
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          URL: ${{ steps.sha.outputs.url }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -e
          git clone --branch "$TAP_BRANCH" --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${TAP_REPO}.git" tap

          mkdir -p tap/Formula
          cp packaging/homebrew/dictator.rb tap/Formula/dictator.rb
          cd tap
          sed -i -E "s|^  url \".*\"|  url \"${URL}\"|"       Formula/dictator.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Formula/dictator.rb

          # Re-running the same tag must not fail the job.
          if git diff --quiet -- Formula/dictator.rb; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dictator.rb
          git commit -m "dictator ${GITHUB_REF_NAME}"
          git push origin "$TAP_BRANCH"
