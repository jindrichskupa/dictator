# dictator's own tmux config.
#
# This is a TEMPLATE. dictator generates $DICTATOR_STATE/tmux.conf from it and
# starts its server with `tmux -L dictator -f <that file>`, so these sessions
# are isolated twice over: their own socket, and their own configuration.
# Nothing you do to ~/.tmux.conf changes how dictator behaves, and nothing
# here leaks into your other tmux servers.
#
# Attach by hand:  tmux -L dictator attach

# screen muscle memory
set -g prefix C-a
bind C-a send-prefix
unbind C-b

set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -g escape-time 10          # no lag on Esc, which Claude Code uses
set -g focus-events on
# When the session a client is in gets destroyed — Claude quits, dict rm, a
# crash — move that client to another session instead of dropping it back to
# the shell. Being thrown out of tmux entirely is never the useful answer.
set -g detach-on-destroy off
# Identity on the left, cheat sheet on the right. That order matters: tmux
# truncates status-right when the terminal is narrow, so what gets cut is the
# reminder, never the answer to "which session is this".
set -g status-left '#[bold] dictator #[default] #S '
set -g status-left-length 60
# The keys worth remembering, dimmed so they read as a footnote. Below 150
# columns the list drops to the three that matter most rather than being
# truncated mid-word; prefix ? has the rest either way.
set -g status-right '#{?#{>=:#{client_width},180},#[default]^a N#[dim] new  #[default]^a S#[dim] switch  #[default]^a ⏎#[dim] shell  #[default]^a i#[dim] where  #[default]^a K#[dim] kill  #[default]^a X#[dim] rm  #[default]^a ?#[dim] help ,#[default]^a S#[dim] switch  #[default]^a ⏎#[dim] shell  #[default]^a K#[dim] kill  #[default]^a X#[dim] rm  #[default]^a ?#[dim] help }#[default]'
set -g status-right-length 100

# `zsh -f` skips ~/.zshrc and sources only the plugin. Measured on this machine:
# `zsh -ic` costs 856ms (oh-my-zsh + powerlevel10k + plugins), `zsh -f` costs
# 5ms. A popup does not need your prompt theme — it needs `dict`.
#
# The work sessions these popups create still get a full `zsh -ic`; that is
# where the interactive environment actually matters. See _dict_launch_cmd.
#
# @DICTATOR_HOME@ and @CONF@ are substituted by _dict_gen_conf, which writes
# the result to $DICTATOR_STATE/tmux.conf; that generated file is what tmux
# actually loads.
#
# Deliberately NOT `$DICTATOR_HOME`: tmux would expand it at parse time from
# whatever environment happened to trigger the load, and any `tmux source-file`
# run outside the plugin — `prefix r` included — has no DICTATOR_HOME. The
# result was a binding reading `source /dictator.plugin.zsh`, which made every
# popup flash and vanish. zsh does the substitution once, at generation.
bind N display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict new'"
# One picker, not two. `dict ls` stays for the terminal and for scripts.
bind S display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict sw'"
bind A display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict adopt'"

# `?` is tmux's own list-keys by default; a cheat sheet for THIS tool is worth
# more here. The raw key table is still one command away: prefix : list-keys
# Upper-case R, because lower-case r is the config reload above.
bind R display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict rename'"

bind K display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict kill'"
bind X display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict rm'"

# The same two, aimed at the session you are already in — no picker, nothing to
# mis-select. The id comes from $DICTATOR_ID, which `dict new` puts in the tmux
# session's own environment and every popup inherits.
#
# NOT `#{session_name}`: display-popup does not expand formats in the command it
# runs (only in -d, -t and friends), so the format arrived at the shell intact,
# where zsh read a word starting with `#` as a comment — leaving a bare
# `dict rm`, which opens the picker. The bug looked exactly like the feature
# not being wired up at all.
#
# SINGLE quotes around the whole command, unlike every other binding here:
# inside double quotes tmux expands $DICTATOR_ID while it PARSES the config,
# from the environment of whoever ran the reload. That bakes one person's
# session id into the binding for every session. Single quotes leave the
# expansion to the popup's own shell, which is where the answer lives.
#
# An id that is empty — a session that predates this, or a hand-made tmux
# session — falls back to the picker rather than failing, which is the old
# behaviour and a fine place to land.
#
# Control-modified, one key away from the picker versions: the destructive
# thing needing the more deliberate chord is the right way round.
#
# 12 lines, not a percentage: all these popups hold is a yes/no dialog, and on a
# short terminal a percentage height leaves fzf fewer rows than it asks for.
bind C-k display-popup -w 70% -h 12 -E 'zsh -f -c "source @DICTATOR_HOME@/dictator.plugin.zsh; dict kill $DICTATOR_ID"'
bind C-x display-popup -w 70% -h 12 -E 'zsh -f -c "source @DICTATOR_HOME@/dictator.plugin.zsh; dict rm $DICTATOR_ID"'

# Through a pager, because the help outgrew a small popup and the top scrolled
# away with no way back. less also gives it the keypress-to-close the old
# `read -k -s` provided: q.
bind ? display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; DICT_COLOR=1 dict help | less -R'"

# A shell in the session's own directory, for the things that are quicker to
# type than to ask for: git status, ls, a quick grep.
#
# `#{pane_current_path}` is the cwd of whatever is running in the pane, so all
# of these land where Claude is working, worktree included.
# No command: tmux runs default-shell, which is your login shell. Naming
# $SHELL here would freeze it into the config at parse time.
bind Enter display-popup -d '#{pane_current_path}' -w 80% -h 70% -E
bind c     new-window    -c '#{pane_current_path}'
bind '|'   split-window -h -c '#{pane_current_path}'
bind '-'   split-window -v -c '#{pane_current_path}'

# Which session is this? The status bar carries the name; this adds the title,
# the repository and the state, in one line that fades on its own. run-shell,
# not #(), so the message is built before it is displayed rather than after.
bind i run-shell "zsh -fc 'source @DICTATOR_HOME@/dictator.plugin.zsh; tmux display-message -d 4000 \"\$(dict where #{session_name})\"'"

bind r source-file @CONF@ \; display 'dictator config reloaded'

# Switching without a picker is native tmux and needs no binding:
#   prefix w   session tree
#   prefix (   previous session
#   prefix )   next session
#   prefix L   last session
