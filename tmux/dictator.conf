# dictator's own tmux config.
#
# This is a TEMPLATE. dictator generates $DICTATOR_STATE/tmux.conf from it and
# starts its server with `tmux -L dictator -f <that file>`, so these sessions
# are isolated twice over: their own socket, and their own configuration.
# Nothing you do to ~/.tmux.conf changes how dictator behaves, and nothing
# here leaks into your other tmux servers.
#
# Attach by hand:  tmux -L dictator attach

# screen muscle memory
set -g prefix C-a
bind C-a send-prefix
unbind C-b

set -g mouse on
set -g base-index 1
set -g history-limit 50000
set -g escape-time 10          # no lag on Esc, which Claude Code uses
set -g focus-events on
set -g status-left '#[bold] dictator #[default]'
set -g status-right ' #S '

# `zsh -f` skips ~/.zshrc and sources only the plugin. Measured on this machine:
# `zsh -ic` costs 856ms (oh-my-zsh + powerlevel10k + plugins), `zsh -f` costs
# 5ms. A popup does not need your prompt theme — it needs `dict`.
#
# The work sessions these popups create still get a full `zsh -ic`; that is
# where the interactive environment actually matters. See _dict_launch_cmd.
#
# @DICTATOR_HOME@ and @CONF@ are substituted by _dict_gen_conf, which writes
# the result to $DICTATOR_STATE/tmux.conf; that generated file is what tmux
# actually loads.
#
# Deliberately NOT `$DICTATOR_HOME`: tmux would expand it at parse time from
# whatever environment happened to trigger the load, and any `tmux source-file`
# run outside the plugin — `prefix r` included — has no DICTATOR_HOME. The
# result was a binding reading `source /dictator.plugin.zsh`, which made every
# popup flash and vanish. zsh does the substitution once, at generation.
bind N display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict new'"
# One picker, not two. `dict ls` stays for the terminal and for scripts.
bind S display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict sw'"

# `?` is tmux's own list-keys by default; a cheat sheet for THIS tool is worth
# more here. The raw key table is still one command away: prefix : list-keys
bind K display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict kill'"
bind X display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict rm'"

bind ? display-popup -w 90% -h 85% -E "zsh -f -c 'source @DICTATOR_HOME@/dictator.plugin.zsh; dict help; print; read -k -s'"

# A shell in the session's own directory, for the things that are quicker to
# type than to ask for: git status, ls, a quick grep.
#
# `#{pane_current_path}` is the cwd of whatever is running in the pane, so all
# of these land where Claude is working, worktree included.
# No command: tmux runs default-shell, which is your login shell. Naming
# $SHELL here would freeze it into the config at parse time.
bind Enter display-popup -d '#{pane_current_path}' -w 80% -h 70% -E
bind c     new-window    -c '#{pane_current_path}'
bind '|'   split-window -h -c '#{pane_current_path}'
bind '-'   split-window -v -c '#{pane_current_path}'

bind r source-file @CONF@ \; display 'dictator config reloaded'

# Switching without a picker is native tmux and needs no binding:
#   prefix w   session tree
#   prefix (   previous session
#   prefix )   next session
#   prefix L   last session
